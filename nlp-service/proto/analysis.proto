syntax = "proto3";

package nlp;

option go_package = "github.com/edson/kanso-api/internal/nlp/proto";

service AnalysisService {
  rpc Analyze(AnalyzeRequest) returns (AnalyzeResponse);
}

message AnalyzeRequest {
  string registro_id = 1;
  string sensacoes = 2;
  string contexto = 3;
  string pensamentos = 4;
  string data_hora = 5;
}

message EmotionScore {
  string emotion = 1;
  float score = 2;
}

message AnalyzeResponse {
  string emotion_principal = 1;
  repeated EmotionScore emotions = 2;
  map<string, float> scores = 3;
  float intensidade = 4;
  string analise_adicional = 5;
  string modelo_versao = 6;
}

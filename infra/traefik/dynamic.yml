tls:
  certificates:
    - certFile: /etc/traefik/certs/kanso.local.pem
      keyFile: /etc/traefik/certs/kanso.local-key.pem

http:
  routers:
    api-dev:
      rule: "Host(`kanso.local`) && PathPrefix(`/api`)"
      entrypoints:
        - websecure
      tls: {}
      service: api
      middlewares:
        - auth-ratelimit
        - secHeaders
        - cors-headers

    api:
      rule: "Host(`kanso.edsonajeje.cloud`) && PathPrefix(`/api`)"
      entrypoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: api
      middlewares:
        - auth-ratelimit
        - secHeaders
        - cors-headers

    api-local:
      rule: "Host(`localhost`) && PathPrefix(`/api`)"
      entrypoints:
        - websecure
      tls: {}
      service: api
      middlewares:
        - auth-ratelimit
        - cors-headers

    couchdb-dev:
      rule: "Host(`kanso.local`) && PathPrefix(`/db`)"
      entrypoints:
        - websecure
      tls: {}
      service: couchdb
      middlewares:
        - couchdb-strip
        - secHeaders
        - db-ratelimit
        - cors-headers

    couchdb-local:
      rule: "Host(`localhost`) && PathPrefix(`/db`)"
      entrypoints:
        - websecure
      tls: {}
      service: couchdb
      middlewares:
        - couchdb-strip
        - db-ratelimit
        - cors-headers

    couchdb:
      rule: "Host(`kanso.edsonajeje.cloud`) && PathPrefix(`/db`)"
      entrypoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: couchdb
      middlewares:
        - couchdb-strip
        - secHeaders
        - db-ratelimit
        - cors-headers

    frontend-dev:
      rule: "Host(`kanso.local`)"
      entrypoints:
        - websecure
      tls: {}
      service: frontend
      middlewares:
        - secHeaders

    frontend-local:
      rule: "Host(`localhost`)"
      entrypoints:
        - websecure
      tls: {}
      service: frontend

    frontend:
      rule: "Host(`kanso.edsonajeje.cloud`)"
      entrypoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: frontend
      middlewares:
        - secHeaders

    http-catchall:
      rule: "HostRegexp(`{host:.+}`)"
      entrypoints:
        - web
      middlewares:
        - redirect-to-https
      service: noop

  services:
    noop:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:65535"
    api:
      loadBalancer:
        servers:
          - url: "http://api:8080"

    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:80"

    couchdb:
      loadBalancer:
        servers:
          - url: "http://couchdb:5984"

  middlewares:
    couchdb-strip:
      stripPrefix:
        prefixes:
          - "/db"

    cors-headers:
      headers:
        accessControlAllowOriginList:
          - "http://localhost:5173"
          - "https://kanso.local"
          - "https://kanso.edsonajeje.cloud"
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
        accessControlAllowCredentials: true

    secHeaders:
      headers:
        contentSecurityPolicy: "default-src 'self'; script-src 'self' https://accounts.google.com https://accounts.google.com/gsi/ https://www.googleapis.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; frame-src https://accounts.google.com; connect-src 'self' https://accounts.google.com; img-src 'self' data:; font-src 'self' data:"
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customFrameOptionsValue: "DENY"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"

    auth-ratelimit:
      rateLimit:
        average: 10
        burst: 20
        period: 1m
        sourceCriterion:
          ipStrategy:
            depth: 1

    db-ratelimit:
      rateLimit:
        average: 30
        burst: 60
        period: 1m
        sourceCriterion:
          ipStrategy:
            depth: 1

    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

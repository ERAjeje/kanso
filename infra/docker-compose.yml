# Kanso Infrastructure — Docker Compose
# Provides CouchDB, chromedp (headless PDF rendering), and the Go API service.
#
# Architecture:
# - chromedp runs in its own container (kanso-chromedp) with --remote-debugging-port
# - API connects to chromedp via CDP WebSocket (no chromedp binary in API container)
# - This allows the API container to run as non-root user
#
# Security:
# - CouchDB admin password set via COUCHDB_PASSWORD env
# - chromedp/headless-shell isolated in its own container with seccomp=unconfined
# - API container runs as non-root (appuser) without seccomp exceptions
# - Memory limits prevent resource exhaustion

services:
  traefik:
    image: traefik:v3
    container_name: kanso-traefik
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik:/etc/traefik
      - ./traefik/certs:/etc/traefik/certs
      - ./traefik/acme.json:/etc/traefik/acme.json
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  couchdb:
    image: couchdb:3.5
    container_name: kanso-couchdb
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:?COUCHDB_PASSWORD is required — set in .env or environment}
    # Port 5984 intentionally NOT exposed to host — access via Traefik proxy /db only
    # Internal Docker network access: couchdb:5984 (for API, scheduler, NLP)
    volumes:
      - couchdb-data:/opt/couchdb/data
      - ./couchdb/local.ini:/opt/couchdb/etc/local.d/10-jwt-auth.ini
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      traefik:
        condition: service_started

  chromedp:
    build:
      context: ./chromedp
      dockerfile: Dockerfile
    container_name: kanso-chromedp
    expose:
      - "9222"
    mem_limit: 512m
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
    healthcheck:
      test: ["CMD-SHELL", "socat /dev/null TCP4:localhost:9222,connect-timeout=3"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ../backend
      target: runtime
    container_name: kanso-api
    env_file: ../.env
    environment:
      - COUCHDB_URL=http://couchdb:5984
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:?COUCHDB_PASSWORD is required — set in .env or environment}
      - CHROMEDP_WS_URL=http://chromedp:9222
      - GRPC_CA_CERT=/certs/ca.crt
    volumes:
      - grpc-certs:/certs:ro
    ports:
      - "8080:8080"
    depends_on:
      couchdb:
        condition: service_healthy
      chromedp:
        condition: service_healthy
      traefik:
        condition: service_started
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    build:
      context: ../scheduler
      dockerfile: Dockerfile
    container_name: kanso-scheduler
    env_file: ../.env
    environment:
      - COUCHDB_URL=http://couchdb:5984
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:?COUCHDB_PASSWORD is required — set in .env or environment}
      - API_URL=http://api:8080
      - SCHEDULER_API_KEY=${SCHEDULER_API_KEY}
    depends_on:
      couchdb:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nlp:
    build:
      context: ../nlp-service
      dockerfile: Dockerfile
    container_name: kanso-nlp
    environment:
      - GRPC_PORT=50051
      - HTTP_PORT=8000
      - GRPC_CERT_DIR=/certs
    expose:
      - "50051"
      - "8000"
    volumes:
      - grpc-certs:/certs:ro
    depends_on:
      couchdb:
        condition: service_healthy
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  couchdb-data:
    labels:
      - "kanso.backup=true"
  grpc-certs:
    driver: local
    driver_opts:
      type: none
      device: ./certs
      o: bind

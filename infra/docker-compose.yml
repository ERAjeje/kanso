# Kanso Infrastructure — Docker Compose
# Provides CouchDB and the API service with chromedp PDF generation support.
#
# Security:
# - CouchDB admin password set via COUCHDB_PASSWORD env
# - chromedp/headless-shell requires seccomp=unconfined (chrome needs clone/fork)
# - Memory limits prevent resource exhaustion

services:
  traefik:
    image: traefik:v3
    container_name: kanso-traefik
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik
      - ./traefik/certs:/etc/traefik/certs
    restart: unless-stopped

  couchdb:
    image: couchdb:3.5
    container_name: kanso-couchdb
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-admin123}
    ports:
      - "5984:5984"
    volumes:
      - couchdb-data:/opt/couchdb/data
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.couchdb.rule=Host(`kanso.local`) && PathPrefix(`/db`)"
      - "traefik.http.routers.couchdb.entrypoints=websecure"
      - "traefik.http.routers.couchdb.tls=true"
      - "traefik.http.services.couchdb.loadbalancer.server.port=5984"
      - "traefik.http.routers.couchdb.middlewares=couchdb-strip"
      - "traefik.http.middlewares.couchdb-strip.stripprefix.prefixes=/db"

  api:
    build:
      context: ../backend
      target: runtime
    container_name: kanso-api
    env_file: ../.env
    environment:
      - COUCHDB_URL=http://couchdb:5984
      - COUCHDB_USER=admin
      - PDF_TMP_DIR=/tmp/kanso-pdf
      - CHROMEDP_PATH=/headless-shell/headless-shell
    ports:
      - "8080:8080"
    depends_on:
      couchdb:
        condition: service_healthy
    volumes:
      - pdf-tmp:/tmp/kanso-pdf
    mem_limit: 2g
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`kanso.local`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.services.api.loadbalancer.server.port=8080"

  scheduler:
    build:
      context: ../scheduler
      dockerfile: Dockerfile
    container_name: kanso-scheduler
    env_file: ../.env
    environment:
      - COUCHDB_URL=http://couchdb:5984
      - COUCHDB_USER=admin
      - API_URL=http://api:8080
    depends_on:
      couchdb:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  nlp:
    build:
      context: ../nlp-service
      dockerfile: Dockerfile
    container_name: kanso-nlp
    environment:
      - GRPC_PORT=50051
      - HTTP_PORT=8000
    expose:
      - "50051"
      - "8000"
    depends_on:
      couchdb:
        condition: service_healthy
    mem_limit: 4g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  couchdb-data:
  pdf-tmp:

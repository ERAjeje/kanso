; CouchDB JWT Authentication Configuration
; Matches backend JWT_SECRET for PouchDB sync
;
; Generate updated value on secret change:
;   echo -n '<new-secret>' | base64

[couchdb]
uuid = kanso-dev

[chttpd]
authentication_handlers = {chttpd_auth, jwt_authentication_handler}, {chttpd_auth, default_authentication_handler}

[jwt_auth]
required_claims = exp,iat

[jwt_keys]
hmac:_default = ZGV2LXNlY3JldC1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==
